name: Deploy verified release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify uploaded release archive
        shell: bash
        run: |
          set -euo pipefail
          test -f csv-consistency-repair-1.3.5-release.zip
          echo "4c44c372f19d22675f3d6ce892ce2244fc5ff75873209656418d515d74a6cb54  csv-consistency-repair-1.3.5-release.zip" | sha256sum -c -

      - name: Materialize exact public source tree
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          unzip -q csv-consistency-repair-1.3.5-release.zip -d "$tmp"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$tmp"/. .
          rm -rf "$tmp"

      - name: Verify source release
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest build
          pytest -q
          python -m build
          python - <<'PY'
          import csv_consistency_repair
          print('csv_consistency_repair', csv_consistency_repair.__version__)
          assert csv_consistency_repair.__version__ == '1.3.5'
          PY

      - name: Publish materialized source tree to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build *.egg-info src/*.egg-info .pytest_cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Release 1.3.5"
          git push origin HEAD:main
